[project]
name = "frappe-mcp-gateway"
version = "1.0.0"
description = "OAuth-protected MCP gateway for Frappe applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.0.0",
    "PyJWT~=2.13.0",
    "uvicorn==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frappe_mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
